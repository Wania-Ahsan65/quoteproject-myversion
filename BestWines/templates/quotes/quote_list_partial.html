{% for quote in quotes %}
  <a href="{% url 'quotes:detail' quote.id %}" class="block bg-white p-4 rounded shadow hover:shadow-md transition mb-2">
    <div class="flex justify-between items-center">
      <div>
        <h2 class="text-lg font-semibold">Quote #{{ quote.id }}</h2>
        <p class="text-sm text-gray-500">{{ quote.customer_name }} — {{ quote.created_at|date:"Y-m-d H:i" }}</p>
      </div>
      <div class="text-right">
        <span class="text-sm text-gray-700">{{ quote.items.count }} item{{ quote.items.count|pluralize }}</span>
      </div>
    </div>
  </a>
{% empty %}
  <p class="text-gray-500">No quotes found.</p>
{% endfor %}
