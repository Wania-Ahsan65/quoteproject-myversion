<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - BestWines</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-sm p-8 space-y-6 bg-white rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-700">Login to BestWines</h2>

    {% if error %}
      <div class="p-2 text-sm text-red-600 bg-red-100 border border-red-300 rounded">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" name="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" name="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <button type="submit" class="w-full py-2 font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">
        Login
      </button>
    </form>

    <p class="text-sm text-center text-gray-500">
      Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">Register</a>
    </p>
  </div>

</body>
</html>
